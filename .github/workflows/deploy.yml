name: PWA bauen und auf GitHub Pages veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Icons erzeugen
        run: npm run icons

      - name: Bauen
        # Auf GitHub Pages liegt die App unter /<repo>/ — Vite muss das wissen,
        # sonst finden Service Worker und Manifest ihre Dateien nicht.
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build

      # Pages muss einmalig von Hand eingeschaltet werden:
      # Settings → Pages → Source: GitHub Actions. Das Workflow-Token darf
      # die Seite nicht selbst anlegen, unabhängig von der Sichtbarkeit.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
